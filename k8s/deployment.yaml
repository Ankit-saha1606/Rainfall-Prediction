apiVersion: apps/v1
kind: Deployment
metadata:
  name: vidarbha-rainfall-api
  labels:
    app: vidarbha-rainfall-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vidarbha-rainfall-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: vidarbha-rainfall-api
      annotations:
        # Lets a Prometheus server auto-discover this pod's /metrics endpoint
        prometheus.io/scrape: "true"
        prometheus.io/port: "5000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: rainfall-api
          image: vidarbha-rainfall-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
              name: http
          env:
            - name: PORT
              value: "5000"
            - name: FLASK_DEBUG
              value: "false"
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          # Readiness gates traffic: pod won't receive requests until the
          # model is loaded and /health returns 200.
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          # Liveness restarts the pod if it becomes unresponsive.
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
          volumeMounts:
            - name: model-storage
              mountPath: /app/models
      volumes:
        - name: model-storage
          persistentVolumeClaim:
            claimName: rainfall-model-pvc
